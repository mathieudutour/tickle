# Typecheck, unit tests and browser tests on every push. Deploys are separate (Cloudflare Workers Builds).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The app runs this bundle of the shared TypeScript: it must match the source.
      - name: core.js is up to date
        run: npm run build:native && git diff --exit-code ios/Tickle/Resources/core.js
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Dev server for the live sync test
        run: |
          npx vite --port 5299 --strictPort > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5299/ > /dev/null && exit 0; sleep 2; done
          cat dev-server.log; exit 1
      - name: Tests
        working-directory: ios
        env:
          TEST_RUNNER_TICKLE_TEST_SERVER: http://localhost:5299
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          # The UI tests time animations and toasts, which the shared runners are too slow for: they run locally.
          xcodebuild test -project Tickle.xcodeproj -scheme Tickle -destination "id=$device" CODE_SIGNING_ALLOWED=NO \
            -skip-testing:TickleUITests
